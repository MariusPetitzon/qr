<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QR-code gescand ✔</title>
<style>
  :root {
    --bg: #14121f;
    --card: #1f1c30;
    --tekst: #f3f0ff;
    --zacht: #a9a3c7;
    --accent: #ffcc33;
    --accent2: #ff5c8a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--tekst);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.5;
    min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; padding: 24px 18px 48px; }

  /* ---------- nep-laadscherm ---------- */
  #laden {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center; z-index: 10;
    transition: opacity .35s;
  }
  #laden.weg { opacity: 0; pointer-events: none; }
  #laadna { margin-top: 28px; max-width: 420px; opacity: 0; transition: opacity 1s; }
  #laadna.zichtbaar { opacity: 1; }
  #laden .icoon { font-size: 56px; margin-bottom: 12px; }
  #laden .regel { color: var(--zacht); min-height: 1.5em; font-size: 16px; }
  .balk { width: min(320px, 80vw); height: 10px; background: #2c2842; border-radius: 99px; overflow: hidden; margin: 18px 0 10px; }
  .balk div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s; }

  /* ---------- inhoud ---------- */
  .teller {
    display: inline-block; font-size: 14px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--bg); background: var(--accent);
    padding: 4px 10px; border-radius: 99px; margin-bottom: 14px;
  }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 18px; }
  .gif { width: 100%; border-radius: 14px; display: block; margin: 0 0 20px; background: var(--card); }
  video.media { width: 100%; border-radius: 14px; display: block; margin: 0 0 20px; background: #000; }
  audio.media { width: 100%; display: block; margin: 0 0 20px; }
  .tekst p { margin: 0 0 14px; }

  details {
    background: var(--card); border-radius: 12px; margin: 12px 0; overflow: hidden;
  }
  summary {
    cursor: pointer; padding: 14px 16px; font-weight: 600; list-style: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; font-size: 24px; color: var(--accent); transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  details .binnen { padding: 0 16px 14px; color: var(--zacht); }
  details .binnen p { margin: 0 0 10px; }

  .voet { margin-top: 36px; font-size: 14px; color: var(--zacht); text-align: center; }
  .groot { font-size: 64px; text-align: center; margin: 40px 0 10px; }
  .midden { text-align: center; }
</style>
</head>
<body>

<div id="laden">
  <div class="icoon">📱</div>
  <div><b>QR-code wordt verwerkt…</b></div>
  <div class="balk"><div id="voortgang"></div></div>
  <div class="regel" id="laadregel"></div>
  <div id="laadna"></div>
</div>

<main id="inhoud"></main>

<script src="codes.js"></script>
<script src="inhoud.js"></script>
<script>
(function () {
  const naam = (typeof HEIDIGOM !== "undefined") ? HEIDIGOM : "Heidigom";
  const codes = (typeof CODES !== "undefined") ? CODES : {};
  const acts = (typeof ACTIVITEITEN !== "undefined") ? ACTIVITEITEN : [];
  const lok = (typeof LOKPAGINAS !== "undefined") ? LOKPAGINAS : {};
  const inhoud = document.getElementById("inhoud");
  const totaal = Object.keys(codes).length;

  // code uit de URL: ...github.io/qr/?8ezq
  const code = decodeURIComponent(location.search.replace(/^\?/, "").split("&")[0]).toLowerCase();
  const doel = codes[code] || "";

  // --- hulpfuncties ---
  const metNaam = t => String(t || "").replace(/\{naam\}/g, naam);
  function media(bron) {
    const lijst = Array.isArray(bron) ? bron : (bron ? [bron] : []);
    return lijst.map(src => {
      const ext = String(src).split("?")[0].split(".").pop().toLowerCase();
      if (["mp3", "m4a", "wav", "ogg", "aac"].includes(ext))
        return `<audio class="media" controls preload="metadata" src="${src}"></audio>`;
      if (["mp4", "webm", "mov", "m4v"].includes(ext))
        return `<video class="media" controls playsinline preload="metadata" src="${src}"></video>`;
      return `<img class="gif" src="${src}" alt="" onerror="this.remove()">`;
    }).join("");
  }
  function alineas(tekst) {
    if (!String(tekst || "").trim()) return "";
    return metNaam(tekst).trim().split(/\n\s*\n/)
      .map(p => "<p>" + p.trim().replace(/\n/g, "<br>") + "</p>").join("");
  }
  function willekeurig(lijst) { return lijst[Math.floor(Math.random() * lijst.length)]; }
  function gescandTellen(c) {
    try {
      const sleutel = "qr-gescand";
      const set = new Set(JSON.parse(localStorage.getItem(sleutel) || "[]"));
      set.add(c);
      localStorage.setItem(sleutel, JSON.stringify([...set]));
      return set.size;
    } catch (e) { return null; }
  }
  function voet(aantal) {
    if (aantal === null) return "";
    return `<div class="voet">${naam}, je hebt ${aantal} van de OVER 9000! QR-codes gescand. ` +
           `Nog OVER 9000! te gaan.</div>`;
  }

  // --- pagina opbouwen ---
  let eindeloos = false;
  if (doel.startsWith("activiteit:")) {
    // "activiteit:3" = activiteit 3;  "activiteit:3.2" = onderdeel 2 van activiteit 3
    const [n, m] = doel.split(":")[1].split(".").map(x => parseInt(x, 10));
    const act = acts.find(a => a.nummer === n);
    const deel = (act && m) ? (act.onderdelen || [])[m - 1] : null;
    const aantal = gescandTellen(code);
    if (act && (!m || deel)) {
      const p = deel || act;
      const label = deel ? `${metNaam(act.titel)} · ${metNaam(deel.titel)}` : `Activiteit ${act.nummer}`;
      const beeld = p.beeld || p.gif;
      document.title = deel ? `${act.titel} - ${deel.titel}` : act.titel;
      let html = `<div class="teller">${label}</div><h1>${metNaam(deel ? deel.titel : act.titel)}</h1>`;
      html += media(beeld);
      if (alineas(p.tekst)) html += `<div class="tekst">${alineas(p.tekst)}</div>`;
      (p.extra || []).forEach(e => {
        html += `<details><summary>${metNaam(e.titel)}</summary><div class="binnen">${alineas(e.tekst)}</div></details>`;
      });
      inhoud.innerHTML = html + voet(aantal);
    } else {
      inhoud.innerHTML = `<div class="groot">🛠️</div><h1 class="midden">Activiteit nog niet ingevuld</h1>`;
    }
  } else if (doel && lok[doel]) {
    const aantal = gescandTellen(code);
    const v = willekeurig(lok[doel].varianten || [{ titel: "", tekst: "" }]);
    if (doel === "eindeloos") {
      eindeloos = true;
      document.getElementById("laadna").innerHTML = alineas(v.tekst);
    } else {
      inhoud.innerHTML =
        `<div class="groot">${lok[doel].emoji || ""}</div>
         <h1 class="midden">${metNaam(v.titel)}</h1>
         <div class="tekst midden">${alineas(v.tekst)}</div>` + voet(aantal);
    }
  } else if (!code) {
    inhoud.innerHTML =
      `<div class="groot">🤨</div><h1 class="midden">Nice try, ${naam}.</h1>
       <p class="midden">Zonder QR-code geen uitleg. Scan er maar eentje.</p>`;
  } else {
    inhoud.innerHTML =
      `<div class="groot">🚫</div><h1 class="midden">Ongeldige QR-code</h1>
       <p class="midden">Deze code bestaat niet. Probeer opnieuw te scannen, ${naam}.</p>`;
  }

  // --- nep-laadscherm ---
  const balk = document.getElementById("voortgang");
  const regel = document.getElementById("laadregel");
  const regels = [
    "Camera-toegang aanvragen…",
    "Cookies accepteren…",
    "Locatie delen met 847 partners…",
    "Inschrijven op de nieuwsbrief…",
    "Bijna klaar…",
  ];

  if (eindeloos) {
    const meer = regels.concat([
      "Nog heel even…", "Server opwarmen…", "QR-code ontcijferen…", "Even geduld…",
      "Bijna. Echt.", "Software-update installeren (1 van 37)…", "Wachten op goedkeuring van de getuige…",
    ]);
    const start = Date.now();
    let i = 0;
    regel.textContent = meer[0];
    setInterval(() => { i = (i + 1) % meer.length; regel.textContent = meer[i]; }, 2200);
    setInterval(() => {
      const t = (Date.now() - start) / 1000;
      balk.style.width = (99 * (1 - Math.exp(-t / 6))).toFixed(1) + "%";
    }, 200);
    setTimeout(() => document.getElementById("laadna").classList.add("zichtbaar"), 25000);
  } else {
    const duur = doel ? 2200 : 900;   // ms
    const stap = duur / regels.length;
    regels.forEach((r, i) => setTimeout(() => {
      regel.textContent = r;
      balk.style.width = Math.round(((i + 1) / regels.length) * 100) + "%";
    }, i * stap));
    setTimeout(() => document.getElementById("laden").classList.add("weg"), duur + 150);
  }
})();
</script>
</body>
</html>
